# GitHub Pages (Jekyll) settings for the docs site.
# Every markdown page in docs/ renders with the HUD layout in _layouts/default.html.
# Built and deployed by .github/workflows/pages.yml.

title: EDGEfab
url: https://edgemodders.github.io
baseurl: /EDGEfab
repo: https://github.com/Edgemodders/EDGEfab

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

defaults:
  - scope:
      path: ""
    values:
      layout: default

# Status bar links, in order.
nav:
  - title: Docs
    url: /
  - title: Build plan
    url: /plan.html
  - title: Design
    url: /design.html
  - title: UE5 assets
    url: /ue-assets.html
  - title: Tests
    url: /testing.html
  - title: Changelog
    url: /changelog.html
  - title: Dev setup
    url: /dev-setup.html
  - title: EDGEmat
    url: https://edgemodders.github.io/EDGEmat/
  - title: REDcode
    url: https://edgemodders.github.io/REDcode/
